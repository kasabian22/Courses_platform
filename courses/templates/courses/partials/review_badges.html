<div class="flex items-center gap-2" aria-label="Course reviews">
    <span class="inline-flex items-center gap-1 rounded-full border border-amber-500/30 bg-[#1c1d22]/90 px-2.5 py-1 text-xs font-semibold text-amber-300" title="Average rating">
        <svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 1.5l2.6 5.27 5.82.85-4.21 4.1 1 5.8L10 14.78l-5.21 2.74 1-5.8-4.21-4.1 5.82-.85L10 1.5z"/>
        </svg>
        {{ course.average_rating|floatformat:1 }}
    </span>
    <span class="inline-flex items-center rounded-full border border-gray-600/70 bg-[#1c1d22]/90 px-2.5 py-1 text-xs font-medium text-gray-300" title="Number of reviews">
        {{ course.reviews_count }} reviews
    </span>
</div>
