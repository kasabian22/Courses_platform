<!-- Custom Video Player -->
<div
    data-video-player
    class="relative isolate w-full overflow-hidden rounded-2xl border border-white/10 bg-[#101114] shadow-xl shadow-black/20"
>
    <div
        data-player-stage
        class="relative aspect-video bg-black"
    >
        <video
            data-video
            src="{{ content.item.video_upload.url }}"
            preload="metadata"
            playsinline
            class="h-full w-full cursor-pointer bg-black object-contain"
        >
            Your browser does not support the HTML5 video tag.
        </video>

        <!-- Center Play Button -->
        <button
            type="button"
            data-center-play
            aria-label="Play video"
            class="absolute left-1/2 top-1/2 z-10 flex h-16 w-16 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border border-white/20 bg-violet-600 text-white shadow-lg shadow-violet-950/40 transition hover:scale-110 hover:bg-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-400"
        >
            <svg viewBox="0 0 24 24" fill="currentColor"
                 class="ml-1 h-7 w-7" aria-hidden="true">
                <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86Z"/>
            </svg>
        </button>

        <!-- Custom Controls -->
        <div
            class="absolute inset-x-0 bottom-0 z-20 bg-gradient-to-t from-black via-black/80 to-transparent"
        >
        
        <!-- Progress Bar with Hover Time Preview -->
        <div
            data-timeline
            class="relative px-4 pb-2 pt-7 sm:px-5"
        >
            <span
                data-seek-tooltip
                class="pointer-events-none absolute left-0 top-1 z-30 hidden -translate-x-1/2 rounded-md border border-white/10 bg-[#28282D] px-2 py-1 text-[11px] font-medium tabular-nums text-white shadow-lg"
            >
                0:00
            </span>
        
            <input
                data-seek
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-label="Video position"
                class="h-1.5 w-full cursor-pointer appearance-none rounded-full accent-violet-500"
            />
        </div>
        

            <!-- Buttons and Time -->
            <div class="flex items-center gap-3 px-3 pb-3 sm:gap-4 sm:px-5 sm:pb-4">
                <!-- Play / Pause -->
                <button
                    type="button"
                    data-play
                    aria-label="Play video"
                    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-white transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-violet-400"
                >
                    <svg data-icon-play viewBox="0 0 24 24"
                         fill="currentColor" class="h-5 w-5" aria-hidden="true">
                        <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86Z"/>
                    </svg>

                    <svg data-icon-pause viewBox="0 0 24 24"
                         fill="currentColor" class="hidden h-5 w-5" aria-hidden="true">
                        <path d="M7 4h3v16H7zM14 4h3v16h-3z"/>
                    </svg>
                </button>

                
                <!-- Elapsed / Remaining Time Toggle -->
                <button
                    type="button"
                    data-time-toggle
                    aria-label="Show remaining time"
                    title="Toggle elapsed and remaining time"
                    class="flex items-center gap-1 whitespace-nowrap rounded-md px-1 py-1 text-xs font-medium tabular-nums text-gray-300 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400 sm:text-sm"
                >
                    <span data-current-time>0:00</span>
                    <span class="text-gray-500">/</span>
                    <span data-duration>0:00</span>
                </button>


                <div class="ml-auto flex items-center gap-1 sm:gap-2">
                    <!-- Mute -->
                    <button
                        type="button"
                        data-mute
                        aria-label="Mute sound"
                        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-gray-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400"
                    >
                        <svg data-icon-sound viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             class="h-5 w-5" aria-hidden="true">
                            <path d="M11 5 6 9H3v6h3l5 4z"/>
                            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                            <path d="M19 5a10 10 0 0 1 0 14"/>
                        </svg>

                        <svg data-icon-muted viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             class="hidden h-5 w-5" aria-hidden="true">
                            <path d="M11 5 6 9H3v6h3l5 4z"/>
                            <path d="m16 9 5 6m0-6-5 6"/>
                        </svg>
                    </button>

                    <!-- Volume Slider -->
                    <input
                        data-volume
                        type="range"
                        min="0"
                        max="1"
                        step="0.05"
                        value="1"
                        aria-label="Volume level"
                        class="hidden w-20 cursor-pointer accent-violet-500 sm:block"
                    />
                    

                    
                    <!-- Playback Speed Dropdown -->
                    <div data-speed-control class="relative z-30">
                        <button
                            type="button"
                            data-speed-button
                            aria-label="Playback speed 1×"
                            aria-expanded="false"
                            aria-haspopup="true"
                            class="flex h-9 min-w-10 items-center justify-center rounded-lg px-2 text-xs font-semibold tabular-nums text-gray-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400"
                        >
                            1×
                        </button>

                        <div
                            data-speed-menu
                            class="absolute bottom-full right-0 mb-2 hidden min-w-28 overflow-hidden rounded-xl border border-white/10 bg-[#25262A] p-1 shadow-2xl"
                        >
                            <button type="button" data-speed="0.25"
                                class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">
                                0.25×
                            </button>
                            <button type="button" data-speed="0.5"
                                class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">
                                0.5×
                            </button>
                            <button type="button" data-speed="0.75"
                                class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">
                                0.75×
                            </button>
                            <button type="button" data-speed="1"
                                aria-pressed="true"
                                class="block w-full rounded-lg bg-violet-600/20 px-3 py-2 text-start text-xs font-medium text-violet-200 transition hover:bg-white/10">
                                default (1×)
                            </button>
                            <button type="button" data-speed="1.25"
                                class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">
                                1.25×
                            </button>
                            <button type="button" data-speed="1.5"
                                class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">
                                1.5×
                            </button>
                            <button type="button" data-speed="1.75"
                                class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">
                                1.75×
                            </button>
                            <button type="button" data-speed="2"
                                class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">
                                2×
                            </button>
                        </div>
                    </div>


                    <!-- Fullscreen -->
                    <button
                        type="button"
                        data-fullscreen
                        aria-label="Full-screen view"
                        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-gray-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400"
                    >
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             class="h-5 w-5" aria-hidden="true">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                            <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                            <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                            <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    
document.querySelectorAll('[data-video-player]').forEach((player) => {
    const video = player.querySelector('[data-video]');
    const centerPlay = player.querySelector('[data-center-play]');
    const playButton = player.querySelector('[data-play]');
    const playIcon = player.querySelector('[data-icon-play]');
    const pauseIcon = player.querySelector('[data-icon-pause]');

    const timeline = player.querySelector('[data-timeline]');
    const seek = player.querySelector('[data-seek]');
    const seekTooltip = player.querySelector('[data-seek-tooltip]');

    const timeToggle = player.querySelector('[data-time-toggle]');
    const currentTime = player.querySelector('[data-current-time]');
    const duration = player.querySelector('[data-duration]');

    const muteButton = player.querySelector('[data-mute]');
    const soundIcon = player.querySelector('[data-icon-sound]');
    const mutedIcon = player.querySelector('[data-icon-muted]');
    const volume = player.querySelector('[data-volume]');

    const fullscreenButton = player.querySelector('[data-fullscreen]');

    const speedControl = player.querySelector('[data-speed-control]');
    const speedButton = player.querySelector('[data-speed-button]');
    const speedMenu = player.querySelector('[data-speed-menu]');

    if (
        !video || !centerPlay || !playButton ||
        !timeline || !seek || !seekTooltip ||
        !timeToggle || !currentTime || !duration
    ) {
        return;
    }

    let showRemainingTime = false;

    // Format seconds as M:SS or H:MM:SS.
    const formatTime = (seconds) => {
        if (!Number.isFinite(seconds) || seconds < 0) {
            return '0:00';
        }

        const total = Math.floor(seconds);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const secs = String(total % 60).padStart(2, '0');

        if (hours > 0) {
            return `${hours}:${String(minutes).padStart(2, '0')}:${secs}`;
        }

        return `${minutes}:${secs}`;
    };

    // Play / Pause
    const togglePlayback = () => {
        if (video.paused || video.ended) {
            if (video.ended) {
                video.currentTime = 0;
            }

            video.play().catch(() => {
                // Playback might be rejected by the browser.
            });
        } else {
            video.pause();
        }
    };

    const updatePlaybackUI = () => {
        const playing = !video.paused && !video.ended;

        playIcon?.classList.toggle('hidden', playing);
        pauseIcon?.classList.toggle('hidden', !playing);
        centerPlay.classList.toggle('hidden', playing);

        const label = playing
            ? 'إيقاف الفيديو مؤقتًا'
            : 'تشغيل الفيديو';

        playButton.setAttribute('aria-label', label);
        centerPlay.setAttribute('aria-label', label);
    };

    centerPlay.addEventListener('click', togglePlayback);
    playButton.addEventListener('click', togglePlayback);
    video.addEventListener('click', togglePlayback);

    video.addEventListener('play', updatePlaybackUI);
    video.addEventListener('pause', updatePlaybackUI);
    video.addEventListener('ended', updatePlaybackUI);

    // Progress bar appearance.
    const updateSeekTrack = (percent) => {
        seek.style.background = `
            linear-gradient(
                to right,
                #795BFF 0%,
                #795BFF ${percent}%,
                rgba(255,255,255,0.22) ${percent}%,
                rgba(255,255,255,0.22) 100%
            )
        `;
    };

    // Elapsed / remaining time and progress.
    const updateProgress = () => {
        const hasDuration =
            Number.isFinite(video.duration) && video.duration > 0;

        const total = hasDuration ? video.duration : 0;
        const elapsed = Number.isFinite(video.currentTime)
            ? video.currentTime
            : 0;

        if (showRemainingTime && hasDuration) {
            currentTime.textContent =
                `-${formatTime(Math.max(0, total - elapsed))}`;
        } else {
            currentTime.textContent = formatTime(elapsed);
        }

        duration.textContent = formatTime(total);

        const percent = hasDuration
            ? Math.min(100, Math.max(0, (elapsed / total) * 100))
            : 0;

        if (!seek.matches(':active')) {
            seek.value = String(percent);
        }

        updateSeekTrack(percent);
    };

    // Toggle the time display when clicked.
    const updateTimeToggleLabel = () => {
        const label = showRemainingTime
            ? 'عرض الوقت المنقضي'
            : 'عرض الوقت المتبقي';

        timeToggle.setAttribute('aria-label', label);
        timeToggle.title = 'التبديل بين الوقت المنقضي والمتبقي';
    };

    timeToggle.addEventListener('click', () => {
        showRemainingTime = !showRemainingTime;
        updateProgress();
        updateTimeToggleLabel();
    });

    // Preview the time at the hovered position on the timeline.
    const updateSeekTooltip = (clientX = null) => {
        if (
            !Number.isFinite(video.duration) ||
            video.duration <= 0
        ) {
            return;
        }

        const seekRect = seek.getBoundingClientRect();
        const timelineRect = timeline.getBoundingClientRect();

        let ratio;

        if (clientX !== null) {
            ratio = (clientX - seekRect.left) / seekRect.width;
        } else {
            ratio = Number(seek.value) / 100;
        }

        ratio = Math.min(1, Math.max(0, ratio));

        seekTooltip.textContent = formatTime(ratio * video.duration);

        const pointerX = clientX !== null
            ? clientX
            : seekRect.left + ratio * seekRect.width;

        const rawX = pointerX - timelineRect.left;

        // Keep the tooltip inside the timeline edges.
        const edgePadding = Math.min(40, timelineRect.width / 2);
        const x = Math.max(
            edgePadding,
            Math.min(timelineRect.width - edgePadding, rawX)
        );

        seekTooltip.style.left = `${x}px`;
        seekTooltip.classList.remove('hidden');
    };

    seek.addEventListener('pointerenter', (event) => {
        updateSeekTooltip(event.clientX);
    });

    seek.addEventListener('pointermove', (event) => {
        updateSeekTooltip(event.clientX);
    });

    seek.addEventListener('pointerleave', () => {
        seekTooltip.classList.add('hidden');
    });

    seek.addEventListener('focus', () => {
        updateSeekTooltip();
    });

    seek.addEventListener('blur', () => {
        seekTooltip.classList.add('hidden');
    });

    // Seek to the selected position.
    seek.addEventListener('input', () => {
        if (Number.isFinite(video.duration) && video.duration > 0) {
            video.currentTime =
                (Number(seek.value) / 100) * video.duration;
        }

        updateProgress();
        updateSeekTooltip();
    });

    video.addEventListener('loadedmetadata', updateProgress);
    video.addEventListener('durationchange', updateProgress);
    video.addEventListener('timeupdate', updateProgress);

    // Volume / Mute.
    const updateVolumeUI = () => {
        const muted = video.muted || video.volume === 0;

        soundIcon?.classList.toggle('hidden', muted);
        mutedIcon?.classList.toggle('hidden', !muted);

        muteButton?.setAttribute(
            'aria-label',
            muted ? 'تشغيل الصوت' : 'كتم الصوت'
        );

        if (volume && !volume.matches(':active')) {
            volume.value = String(muted ? 0 : video.volume);
        }
    };

    muteButton?.addEventListener('click', () => {
        if (video.muted || video.volume === 0) {
            video.muted = false;

            if (video.volume === 0) {
                video.volume = 0.7;
            }
        } else {
            video.muted = true;
        }

        updateVolumeUI();
    });

    volume?.addEventListener('input', () => {
        video.volume = Number(volume.value);
        video.muted = video.volume === 0;
        updateVolumeUI();
    });

    video.addEventListener('volumechange', updateVolumeUI);

    // Playback speed dropdown.
    const setSpeedMenuOpen = (open) => {
        if (!speedMenu || !speedButton) {
            return;
        }

        speedMenu.classList.toggle('hidden', !open);
        speedButton.setAttribute('aria-expanded', String(open));
    };

    const setPlaybackRate = (rate) => {
        video.playbackRate = rate;

        if (speedButton) {
            speedButton.textContent = `${rate}×`;
            speedButton.setAttribute(
                'aria-label',
                `سرعة التشغيل ${rate}×`
            );
        }

        speedMenu?.querySelectorAll('button[data-speed]').forEach((option) => {
            const active = Number(option.dataset.speed) === rate;

            option.classList.toggle('bg-violet-600/20', active);
            option.classList.toggle('text-violet-200', active);
            option.classList.toggle('text-gray-200', !active);

            option.setAttribute('aria-pressed', String(active));
        });
    };

    speedButton?.addEventListener('click', (event) => {
        event.stopPropagation();

        const isOpen = !speedMenu.classList.contains('hidden');
        setSpeedMenuOpen(!isOpen);
    });

    speedMenu?.addEventListener('click', (event) => {
        const option = event.target.closest('button[data-speed]');

        if (!option) {
            return;
        }

        const rate = Number(option.dataset.speed);

        if (!Number.isFinite(rate) || rate <= 0) {
            return;
        }

        setPlaybackRate(rate);
        setSpeedMenuOpen(false);
    });

    // Close the speed menu when clicking outside it or pressing Escape.
    document.addEventListener('click', (event) => {
        if (speedControl && !speedControl.contains(event.target)) {
            setSpeedMenuOpen(false);
        }
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            setSpeedMenuOpen(false);
        }
    });

    // Fullscreen.
    fullscreenButton?.addEventListener('click', async () => {
        try {
            if (document.fullscreenElement === player) {
                await document.exitFullscreen();
            } else if (player.requestFullscreen) {
                await player.requestFullscreen();
            }
        } catch {
            // Fullscreen may be unavailable in some browsers.
        }
    });

    document.addEventListener('fullscreenchange', () => {
        fullscreenButton?.setAttribute(
            'aria-label',
            document.fullscreenElement === player
                ? 'الخروج من ملء الشاشة'
                : 'عرض بملء الشاشة'
        );
    });

    // Initial state.
    updatePlaybackUI();
    updateProgress();
    updateTimeToggleLabel();
    updateVolumeUI();
    setPlaybackRate(video.playbackRate || 1);
});

</script>
