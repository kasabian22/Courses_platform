<!-- Custom Video Player -->
<div data-video-player tabindex="0" class="relative isolate w-full overflow-hidden rounded-2xl border border-white/10 bg-[#101114] shadow-xl shadow-black/20 focus:outline-none">
    <div data-player-stage class="relative aspect-video bg-black">
        <video data-video src="{{ content.item.video_upload.url }}" preload="metadata" playsinline class="h-full w-full cursor-pointer bg-black object-contain">
            Your browser does not support the HTML5 video tag.
        </video>

        <!-- Center Play Button -->
        <button type="button" data-center-play aria-label="Play video" class="absolute left-1/2 top-1/2 z-10 flex h-16 w-16 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border border-white/20 bg-violet-600 text-white shadow-lg shadow-violet-950/40 transition hover:scale-110 hover:bg-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-400">
            <svg viewBox="0 0 24 24" fill="currentColor" class="h-7 w-7" aria-hidden="true">
                <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86Z"/>
            </svg>
        </button>

        <!-- Custom Controls -->
        <div data-controls-bar class="absolute inset-x-0 bottom-0 z-20 bg-gradient-to-t from-black via-black/80 to-transparent transition-opacity duration-300">
            <!-- Progress Bar with Hover Time Preview -->
            <div data-timeline class="relative px-4 pb-2 pt-7 sm:px-5">
                <span data-seek-tooltip class="pointer-events-none absolute left-0 top-1 z-30 hidden -translate-x-1/2 rounded-md border border-white/10 bg-[#28282D] px-2 py-1 text-[11px] font-medium tabular-nums text-white shadow-lg">0:00</span>
                <input data-seek type="range" min="0" max="100" value="0" step="0.1" aria-label="Video position" class="h-1.5 w-full cursor-pointer appearance-none rounded-full accent-violet-500"/>
            </div>

            <!-- Buttons and Time -->
            <div class="flex items-center gap-3 px-3 pb-3 sm:gap-4 sm:px-5 sm:pb-4">
                <!-- Play / Pause -->
                <button type="button" data-play aria-label="Play video" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-white transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-violet-400">
                    <svg data-icon-play viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86Z"/></svg>
                    <svg data-icon-pause viewBox="0 0 24 24" fill="currentColor" class="hidden h-5 w-5" aria-hidden="true"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></svg>
                </button>

                <!-- Elapsed / Remaining Time Toggle -->
                <button type="button" data-time-toggle aria-label="Show remaining time" title="Toggle elapsed and remaining time" class="flex items-center gap-1 whitespace-nowrap rounded-md px-1 py-1 text-xs font-medium tabular-nums text-gray-300 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400 sm:text-sm">
                    <span data-current-time>0:00</span>
                    <span class="text-gray-500">/</span>
                    <span data-duration>0:00</span>
                </button>

                <div class="ml-auto flex items-center gap-1 sm:gap-2">
                    <!-- Mute -->
                    <button type="button" data-mute aria-label="Mute sound" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-gray-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400">
                        <svg data-icon-sound viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
                            <path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>
                        </svg>
                        <svg data-icon-muted viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden h-5 w-5" aria-hidden="true">
                            <path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/>
                        </svg>
                    </button>

                    <!-- Volume Slider -->
                    <input data-volume type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume level" class="hidden w-20 cursor-pointer accent-violet-500 sm:block"/>

                    <!-- Playback Speed Dropdown -->
                    <div data-speed-control class="relative z-30">
                        <button type="button" data-speed-button aria-label="Playback speed 1×" aria-expanded="false" aria-haspopup="true" class="flex h-9 min-w-10 items-center justify-center rounded-lg px-2 text-xs font-semibold tabular-nums text-gray-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400">1×</button>
                        <div data-speed-menu class="absolute bottom-full right-0 mb-2 hidden min-w-28 overflow-hidden rounded-xl border border-white/10 bg-[#25262A] p-1 shadow-2xl">
                            <button type="button" data-speed="0.25" class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">0.25×</button>
                            <button type="button" data-speed="0.5" class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">0.5×</button>
                            <button type="button" data-speed="0.75" class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">0.75×</button>
                            <button type="button" data-speed="1" aria-pressed="true" class="block w-full rounded-lg bg-violet-600/20 px-3 py-2 text-start text-xs font-medium text-violet-200 transition hover:bg-white/10">default (1×)</button>
                            <button type="button" data-speed="1.25" class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">1.25×</button>
                            <button type="button" data-speed="1.5" class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">1.5×</button>
                            <button type="button" data-speed="1.75" class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">1.75×</button>
                            <button type="button" data-speed="2" class="block w-full rounded-lg px-3 py-2 text-start text-xs font-medium text-gray-200 transition hover:bg-white/10">2×</button>
                        </div>
                    </div>

                    <!-- Picture-in-Picture -->
                    <button type="button" data-pip aria-label="Picture in picture" title="Picture in picture" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-gray-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
                            <rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="7" rx="1" fill="currentColor" fill-opacity="0.3"/>
                        </svg>
                    </button>

                    <!-- Fullscreen -->
                    <button type="button" data-fullscreen aria-label="Full-screen view" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-gray-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-400">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
