{% extends 'base.html' %}
{% load tailwind_filters %}




{% block title %}
    Add Course
{% endblock title %}
    



{% block content %}
<div class="max-w-4xl mx-auto mt-10 mb-10 p-6 sm:p-8 bg-[#1c1d22] border border-gray-700 shadow-lg rounded-xl">
    <h1 class="text-2xl font-semibold text-white mb-6">Add a New Course</h1>
    <form method="post" class="dark-form">
        {% csrf_token %}
        {{ form.media }}
        {{ form|crispy }}
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
            Add Course
        </button>
    </form>
</div>
{% endblock content %}
