{% extends 'base.html' %}
{% load tailwind_filters %}




{% block title %}
    Edit Profile
{% endblock title %}

{% block content %}
<div class="min-h-screen bg-[#1e2022] py-10 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-2xl mx-auto bg-[#1c1d22] p-6 sm:p-8 rounded-2xl shadow-lg border border-gray-700">
        <h1 class="text-2xl font-bold text-white mb-2">Edit Profile</h1>
        <p class="text-sm text-gray-400 mb-6">Update your account and profile information.</p>
        <form method="POST" enctype="multipart/form-data" class="dark-form space-y-5">
            {% csrf_token %}
            {{u_form|crispy}}
            {{p_form|crispy}}
            <div class="pt-2">
                <button type="submit" class="w-full px-4 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-[#1c1d22] transition">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
